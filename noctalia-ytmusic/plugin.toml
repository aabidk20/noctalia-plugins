id = "aabidk20/noctalia-ytmusic"
name = "Noctalia YT Music"
version = "0.1.4"
plugin_api = 22
author = "Aabid"
description = "YouTube Music client for Noctalia v5 - miniplayer & full view"
tags = ["ytmusic", "music"]

[[setting]]
key = "debug_logging"
type = "bool"
label_key = "settings.debug_logging.label"
description_key = "settings.debug_logging.description"
default = false

[[widget]]
id = "widget"
entry = "widget.luau"

[widget.actions]
left = "panel-toggle aabidk20/noctalia-ytmusic:mini"
right = "panel-toggle aabidk20/noctalia-ytmusic:panel"
middle = "settings-open-plugin aabidk20/noctalia-ytmusic"

[[panel]]
id = "mini"
entry = "mini.luau"
placement = "floating"
width = 380
height = 460

[[panel]]
id = "panel"
entry = "panel.luau"
placement = "floating"
width = "fill"
height = "fill"

[[service]]
id = "service"
entry = "service.luau"
